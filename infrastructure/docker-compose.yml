name: tax-platform

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tax_platform
      POSTGRES_PASSWORD: tax_platform
      POSTGRES_DB: tax_platform
    # Host port 5544 (not 5432) to avoid clashing with any other Postgres already running
    # on this machine — adjust DATABASE_URL in .env to match if you change this.
    ports:
      - "5544:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tax_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Host port 6390 (not 6379) to avoid clashing with any other Redis already running.
    ports:
      - "6390:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible object storage for documents. SeaweedFS rather than MinIO: the minio/minio
  # (and quay.io/minio/minio) images are no longer publicly pullable. With no S3 identities
  # configured it accepts any access key, so the OBJECT_STORAGE_* values in .env just need to
  # be non-empty.
  object-storage:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -s3 -dir=/data
    # Host port 19010 (not 8333) to avoid clashing with anything already running.
    ports:
      - "19010:8333"
    volumes:
      - objectdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  objectdata:
